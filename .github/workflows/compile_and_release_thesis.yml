name: Compile & Release Thesis PDFs

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "thesis/**"
      - "figures/**"
      - "requirements.txt"
      - ".github/workflows/compile_and_release_thesis.yml"
    tags:
      - "v*"
      - "release-*"
  pull_request:
    paths:
      - "src/**"
      - "thesis/**"
      - "figures/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tests:
    name: Run Unit & Integration Tests (Pre-Release Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLCONFIGDIR: /tmp/mpl_cache
      IPYTHONDIR: /tmp/ipython_cache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Chapter 2 Classical Tests
        run: |
          python -m unittest discover -s src/chapter_2_classical/tests -v

      - name: Run Chapter 4 Quantum Tests
        run: |
          python -m unittest discover -s src/chapter_4_quantum/tests -v

  build-cover:
    name: Build Book Cover
    needs: [run-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Compile Book Cover (cover.tex)
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: thesis
          root_file: cover.tex

      - name: Upload Cover Deliverable
        uses: actions/upload-artifact@v4
        with:
          name: thesis-cover-pdf
          path: thesis/cover.pdf
          if-no-files-found: error

  build-print:
    name: Build Physical Print Edition
    needs: [run-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Synchronize Monograph Assets
        run: |
          mkdir -p thesis/figures
          if [ -d "figures" ]; then
            cp -rn figures/* thesis/figures/ 2>/dev/null || true
          fi

      - name: Compile Print Edition Monograph (main.tex)
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: thesis
          root_file: main.tex

      - name: Upload Print Deliverable
        uses: actions/upload-artifact@v4
        with:
          name: thesis-print-pdf
          path: thesis/main.pdf
          if-no-files-found: error

  build-digital:
    name: Build Digital Screen Edition
    needs: [run-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Synchronize Monograph Assets
        run: |
          mkdir -p thesis/figures
          if [ -d "figures" ]; then
            cp -rn figures/* thesis/figures/ 2>/dev/null || true
          fi

      - name: Compile Digital Edition Monograph (main_digital.tex)
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: thesis
          root_file: main_digital.tex

      - name: Upload Digital Deliverable
        uses: actions/upload-artifact@v4
        with:
          name: thesis-digital-pdf
          path: thesis/main_digital.pdf
          if-no-files-found: error

  release-and-distribute:
    name: Release & Distribute Deliverables
    needs: [run-tests, build-cover, build-print, build-digital]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Artifact Directory
        run: mkdir -p thesis_pdf

      - name: Download Cover Artifact
        uses: actions/download-artifact@v4
        with:
          name: thesis-cover-pdf
          path: thesis_pdf/

      - name: Download Print Edition Artifact
        uses: actions/download-artifact@v4
        with:
          name: thesis-print-pdf
          path: thesis_pdf/

      - name: Download Digital Edition Artifact
        uses: actions/download-artifact@v4
        with:
          name: thesis-digital-pdf
          path: thesis_pdf/

      - name: Organize PDF Deliverables
        run: |
          cp thesis_pdf/cover.pdf thesis_pdf/Quantum_Bayesian_Inference_Thesis_Cover.pdf 2>/dev/null || true
          cp thesis_pdf/main.pdf thesis_pdf/Quantum_Bayesian_Inference_Thesis_Print.pdf 2>/dev/null || true
          cp thesis_pdf/main_digital.pdf thesis_pdf/Quantum_Bayesian_Inference_Thesis_Digital.pdf 2>/dev/null || true
          echo "Verified catalog of thesis PDFs:"
          ls -lh thesis_pdf/

      - name: Commit Compiled Deliverables
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update compiled thesis PDFs"
          file_pattern: "thesis_pdf/*.pdf"
          commit_user_name: "Daniel Rivero Losa"
          commit_user_email: "danielrl.drl@protonmail.com"
          commit_author: "Daniel Rivero Losa <danielrl.drl@protonmail.com>"

      - name: Refresh Floating Latest Tag
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Clean Previous Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y 2>/dev/null || true

      - name: Publish Official Thesis Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Quantum Bayesian Inference Thesis — Latest Edition"
          draft: false
          prerelease: false
          body: |
            # Master's Thesis: Quantum Bayesian Inference in Astrobiological Systems
            **Author:** Daniel Rivero Losa  
            **Supervisor:** Roberto Campos Ortiz  
            **Institution:** Universidad Antonio de Nebrija — Escuela Politécnica Superior  
            **Degree:** Master's Degree in Quantum Computing (Academic Year 2025/2026)  
            **Official Title:** *Quantum Bayesian Inference for Atmospheric Biosignature and Technosignature Characterization in Exoplanetary Systems*

            ---
            ### 📦 Official Compiled Deliverables Attached:
            1. **`Quantum_Bayesian_Inference_Thesis_Digital.pdf`**: Digital screen edition (A4 format with wide margins for marginal commentary and interactive hyperlinks).
            2. **`Quantum_Bayesian_Inference_Thesis_Print.pdf`**: Physical print edition ($18.5 \times 25$ cm Crown Quarto format with symmetric binding margins).
            3. **`Quantum_Bayesian_Inference_Thesis_Cover.pdf`**: Full wrap-around physical book cover (front cover, spine, and back cover abstract in TikZ).
          files: |
            thesis_pdf/Quantum_Bayesian_Inference_Thesis_Digital.pdf
            thesis_pdf/Quantum_Bayesian_Inference_Thesis_Print.pdf
            thesis_pdf/Quantum_Bayesian_Inference_Thesis_Cover.pdf
            thesis_pdf/cover.pdf
            thesis_pdf/main.pdf
            thesis_pdf/main_digital.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
